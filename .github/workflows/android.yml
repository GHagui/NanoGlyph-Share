name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: 0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          archive="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/wasm-pack-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "${archive_path}" \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${archive}"
          printf '%s  %s\n' "${WASM_PACK_SHA256}" "${archive_path}" | sha256sum --check --strict
          mkdir -p "${install_dir}"
          tar --extract --gzip --file "${archive_path}" \
            --directory "${install_dir}" --strip-components=1 \
            "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"
          "${install_dir}/wasm-pack" --version
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: npm ci

      - name: Test and synchronize
        run: |
          npm run test:rust
          npm run cap:sync

      - name: Verify Android project
        working-directory: android
        run: ./gradlew test lint assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nanoglyph-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
