[package]
name = "nanoglyph_core"
version = "0.1.0"
edition = "2021"
description = "Offline-first image encoder/decoder for NanoGlyph — share images via URL using WebAssembly"
repository = "https://github.com/GHagui/NanoGlyph-Share"
license-file = "../LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
flate2 = "1.0"
brotli = "8.0.2"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
